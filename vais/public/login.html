      <div class="lang-switch" role="group" aria-label="Sprache / Language">

      </div>
    </header>

    <main class="auth-main">
      <div class="auth-box">
        <h1 class="auth-title" id="title">Willkommen bei VAIs</h1>
        <p class="auth-sub" id="sub">Die besten KI-Modelle an einem Ort. Kostenlos.</p>

        <!-- 1 · E-Mail -->
        <section class="step active" data-step="email">
          <form id="form-email" novalidate>
            <label class="sr-only" for="email" data-en="Email address">E-Mail-Adresse</label>
            <input class="input" id="email" type="email" name="email" placeholder="E-Mail-Adresse" data-en-placeholder="Email address"
                   autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required autofocus>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Continue">Weiter</button>
          </form>
        </section>

        <!-- 2a · Anmelden -->
        <section class="step" data-step="login">
          <form id="form-login" novalidate>
            <div class="chip"><span data-email></span><button class="link" type="button" data-back data-en="Change">Ändern</button></div>
            <input type="email" autocomplete="username" data-email-hidden hidden>
            <div class="field">
              <label class="sr-only" for="login-password" data-en="Password">Passwort</label>
              <input class="input" id="login-password" type="password" placeholder="Passwort" data-en-placeholder="Password" autocomplete="current-password" required>
              <button class="icon-btn" type="button" data-toggle-pw aria-label="Passwort anzeigen" data-en-aria-label="Show password"></button>
            </div>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Sign in">Anmelden</button>
            <div class="row center"><button class="link" type="button" id="forgot" data-en="Forgot password?">Passwort vergessen?</button></div>
          </form>
        </section>

        <!-- 2b · Registrieren -->
        <section class="step" data-step="register">
          <form id="form-register" novalidate>
            <div class="chip"><span data-email></span><button class="link" type="button" data-back data-en="Change">Ändern</button></div>
            <input type="email" autocomplete="username" data-email-hidden hidden>
            <div class="field">
              <label class="sr-only" for="register-password" data-en="Choose a password">Passwort wählen</label>
              <input class="input" id="register-password" type="password" placeholder="Passwort wählen" data-en-placeholder="Choose a password"
                     autocomplete="new-password" minlength="8" required>
              <button class="icon-btn" type="button" data-toggle-pw aria-label="Passwort anzeigen" data-en-aria-label="Show password"></button>
            </div>
            <p class="hint" data-en="At least 8 characters.">Mindestens 8 Zeichen.</p>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Create account">Konto erstellen</button>
          </form>
        </section>

        <!-- 3 · Code bestätigen -->
        <section class="step" data-step="verify">
          <form id="form-verify" novalidate>
            <div class="otp" data-otp>
              <label class="sr-only" for="verify-code" data-en="6-digit code">6-stelliger Code</label>
              <input id="verify-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
              <div class="otp-boxes" aria-hidden="true"></div>
            </div>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Confirm">Bestätigen</button>
            <div class="row">
              <button class="link" type="button" data-back data-en="Different email">Andere E-Mail</button>
              <button class="link" type="button" data-resend="verify">Code erneut senden</button>
            </div>
          </form>
        </section>

        <!-- 4 · Passwort zurücksetzen -->
        <section class="step" data-step="reset">
          <form id="form-reset" novalidate>
            <div class="otp" data-otp>
              <label class="sr-only" for="reset-code" data-en="6-digit code">6-stelliger Code</label>
              <input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
              <div class="otp-boxes" aria-hidden="true"></div>
            </div>
            <input type="email" autocomplete="username" data-email-hidden hidden>
            <div class="field">
              <label class="sr-only" for="reset-password" data-en="New password">Neues Passwort</label>
              <input class="input" id="reset-password" type="password" placeholder="Neues Passwort" data-en-placeholder="New password"
                     autocomplete="new-password" minlength="8" required>
              <button class="icon-btn" type="button" data-toggle-pw aria-label="Passwort anzeigen" data-en-aria-label="Show password"></button>
            </div>
            <p class="msg error" role="alert"></p>
            <button class="btn" type="submit" data-en="Save password">Passwort speichern</button>
            <div class="row">
              <button class="link" type="button" data-back data-en="Back">Zurück</button>
              <button class="link" type="button" data-resend="reset">Code erneut senden</button>
            </div>
          </form>
        </section>
      </div>
    </main>
