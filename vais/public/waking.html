<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VAIs</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <script src="/boot.js"></script>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .wake { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; }
    .wake .brand svg { width: 34px; height: 34px; }
    .wake .brand span { font-size: 38px; }
    .wake h1 { margin: 18px 0 0; font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 9vw, 46px); color: var(--heading); line-height: 1.05; }
    .wake p { margin: 0; max-width: 340px; color: var(--muted); }
    .bar { width: min(280px, 80vw); height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
    .bar i { display: block; height: 100%; width: 0; background: var(--text); border-radius: 2px; transition: width .9s linear; }
    .time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="wake">
    <span class="brand">
      <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M4.5 6 13 21 21.5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="4.5" cy="6" r="2.4" fill="currentColor"/>
        <circle cx="21.5" cy="6" r="2.4" fill="currentColor"/>
      </svg>
      <span>VAIs</span>
    </span>
    <h1 id="w-title">VAIs wacht gerade auf …</h1>
    <p id="w-text">Der kostenlose Server schläft, wenn eine Weile niemand da war. Das Aufwachen dauert bis zu einer Minute – die Seite lädt dann von selbst.</p>
    <div class="bar" aria-hidden="true"><i id="w-bar"></i></div>
    <span class="time" id="w-time" aria-live="polite"></span>
  </main>
  <script src="/waking.js"></script>
</body>
</html>
