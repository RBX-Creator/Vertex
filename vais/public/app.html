<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VAIs</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242422" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="VAIs">
        <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M4.5 6 13 21 21.5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="4.5" cy="6" r="2.4" fill="currentColor"/>
          <circle cx="21.5" cy="6" r="2.4" fill="currentColor"/>
        </svg>
        <span>VAIs</span>
      </a>
      <div class="account">
        <button class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false" aria-controls="menu"></button>
        <div class="menu" id="menu" hidden>
          <p class="menu-email" id="menu-email"></p>
          <button class="btn" id="logout">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
            Abmelden
          </button>
        </div>
      </div>
    </header>

    <main class="home">
      <h1 class="home-title">Was möchtest du tun?</h1>
      <form class="composer" onsubmit="return false">
        <label class="sr-only" for="prompt">Nachricht</label>
        <textarea id="prompt" rows="2" placeholder="Frag irgendwas …" disabled></textarea>
        <div class="composer-bar">
          <span class="soon">Modelle kommen im nächsten Schritt</span>
          <button class="send" type="submit" disabled aria-label="Senden">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script type="module">
    const res = await fetch('/api/auth/me');
    if (!res.ok) {
      location.replace('/login');
      await new Promise(() => {}); // Weiterleitung abwarten
    }
    const { user } = await res.json();

    const avatar = document.getElementById('avatar');
    const menu = document.getElementById('menu');
    avatar.textContent = user.email[0].toUpperCase();
    avatar.setAttribute('aria-label', `Konto: ${user.email}`);
    document.getElementById('menu-email').textContent = user.email;

    const toggle = (open) => {
      menu.hidden = !open;
      avatar.setAttribute('aria-expanded', String(open));
    };
    avatar.addEventListener('click', (e) => { e.stopPropagation(); toggle(menu.hidden); });
    document.addEventListener('click', (e) => { if (!menu.contains(e.target)) toggle(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggle(false); });

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.replace('/login');
    });
  </script>
</body>
</html>
