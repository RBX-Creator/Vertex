<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>VAIs</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242422" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app.css">
  <script src="/vendor/marked.js" defer></script>
  <script src="/vendor/purify.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="top-left">
      <button class="round-btn" id="open-drawer" aria-label="Seitenleiste öffnen" title="Verlauf" aria-controls="drawer" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M5.5 10l1.5 2-1.5 2"/></svg>
      </button>
      <a class="brand" href="/" aria-label="VAIs – Startseite">
        <svg viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M4.5 6 13 21 21.5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="4.5" cy="6" r="2.4" fill="currentColor"/>
          <circle cx="21.5" cy="6" r="2.4" fill="currentColor"/>
        </svg>
        <span>VAIs</span>
      </a>
      </div>
      <p class="chat-title" id="chat-title"></p>
      <div class="top-actions">
        <button class="round-btn" id="new-chat" aria-label="Neuer Chat" title="Neuer Chat" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v8M8 12h8"/><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12Z"/></svg>
        </button>
        <div class="account">
          <button class="avatar" id="avatar" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu"></button>
          <div class="menu" id="account-menu" hidden>
            <p class="menu-email" id="menu-email"></p>
            <button class="btn" id="logout">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
              Abmelden
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="stage" id="stage">
      <section class="home" id="home">
        <h1 class="home-title">Was möchtest du tun?</h1>
        <p class="demo-note" id="demo-note" hidden>Demo-Modus: Es antworten Platzhalter-Modelle, bis ein OpenRouter-Schlüssel eingetragen ist.</p>
      </section>
      <section class="thread" id="thread" aria-live="polite" hidden></section>
      <section class="board" id="board" hidden>
        <div class="board-inner">
          <h1 class="board-title">Bestenliste</h1>
          <p class="board-sub" id="board-sub"></p>
          <ol class="board-list" id="board-list"></ol>
        </div>
      </section>
    </main>

    <div class="dock">
      <div class="dock-inner">
        <div class="mode-menu" id="mode-menu" role="menu" hidden></div>
        <div class="mode-menu" id="modality-menu" role="menu" hidden></div>
        <section class="suggest" id="suggest" aria-label="Vorschläge">
          <p class="suggest-label">Los geht's</p>
          <div class="suggest-track" id="suggest-track"></div>
        </section>
        <form class="composer" id="composer">
          <div class="vote" id="vote" hidden>
            <button type="button" data-vote="a">A ist besser</button>
            <button type="button" data-vote="tie" class="vote-icon" aria-label="Unentschieden" title="Unentschieden">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
            </button>
            <button type="button" data-vote="bad" class="vote-icon" aria-label="Beide schlecht" title="Beide schlecht">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 18.4 12.8-12.8"/></svg>
            </button>
            <button type="button" data-vote="b">B ist besser</button>
          </div>
          <div class="vote-result" id="vote-result" hidden></div>
          <div class="tray" id="tray" hidden></div>
          <label class="sr-only" for="prompt">Nachricht</label>
          <textarea id="prompt" rows="1" placeholder="Frag irgendwas …" enterkeyhint="send"></textarea>
          <div class="composer-bar">
            <div class="controls">
              <button type="button" class="ctrl" id="attach-btn" aria-label="Bild oder Datei anhängen" title="Bild oder Datei anhängen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <input type="file" id="attach-input" multiple hidden
                accept="image/*,.txt,.md,.csv,.json,.js,.mjs,.ts,.tsx,.jsx,.py,.html,.htm,.css,.xml,.yml,.yaml,.java,.c,.h,.cpp,.cs,.go,.rs,.php,.rb,.sql,.lua,.sh,.log,.ini,.toml">
              <button type="button" class="ctrl" id="mode-btn" aria-haspopup="true" aria-expanded="false" aria-controls="mode-menu"></button>
              <button type="button" class="ctrl" id="modality-btn" aria-haspopup="true" aria-expanded="false" aria-controls="modality-menu"></button>
              <button type="button" class="ctrl model-chip" data-slot="0" hidden></button>
              <button type="button" class="ctrl model-chip" data-slot="1" hidden></button>
            </div>
            <button class="send" id="send" type="submit" aria-label="Senden"></button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Seitenleiste mit Verlauf -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" data-close-drawer></div>
    <nav class="drawer-panel" aria-label="Seitenleiste">
      <div class="drawer-head">
        <span class="brand"><svg viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M4.5 6 13 21 21.5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4.5" cy="6" r="2.4" fill="currentColor"/><circle cx="21.5" cy="6" r="2.4" fill="currentColor"/></svg><span>VAIs</span></span>
        <button class="round-btn" data-close-drawer aria-label="Seitenleiste schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16M18.5 10 17 12l1.5 2"/></svg>
        </button>
      </div>
      <button class="drawer-item" id="d-new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v8M8 12h8"/><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12Z"/></svg>
        Neuer Chat
      </button>
      <button class="drawer-item" id="d-board">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="10" y="9" width="4" height="11" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg>
        Bestenliste
      </button>
      <label class="drawer-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr-only">Chats suchen</span>
        <input id="d-search" type="search" placeholder="Chats suchen" autocomplete="off">
      </label>
      <div class="drawer-list" id="d-list"></div>
      <div class="drawer-foot"><span class="avatar small" id="d-avatar"></span><span id="d-email"></span></div>
    </nav>
  </div>

  <!-- Modellauswahl (Bottom-Sheet) -->
  <div class="sheet" id="model-sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Modell wählen">
      <div class="sheet-grip" aria-hidden="true"></div>
      <label class="sr-only" for="model-search">Modelle suchen</label>
      <input class="input" id="model-search" type="search" placeholder="Modelle suchen" autocomplete="off">
      <div class="cap-tabs" role="tablist" aria-label="Kategorie">
        <button type="button" class="cap-tab" role="tab" data-cap="text" aria-label="Text" title="Text">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5h14M12 5v15M9 20h6"/></svg>
        </button>
        <button type="button" class="cap-tab" role="tab" data-cap="code" aria-label="Code" title="Code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
        </button>
        <button type="button" class="cap-tab" role="tab" data-cap="image" aria-label="Bild" title="Bild">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><circle cx="15.5" cy="8.5" r="1.8"/><path d="m3.5 17 5-5 5 5 2-2 5 5"/></svg>
        </button>
        <button type="button" class="cap-tab" role="tab" data-cap="web" aria-label="Websuche" title="Websuche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
        </button>
      </div>
      <ul class="model-list" id="model-list"></ul>
    </div>
  </div>

  <!-- Antwort im Vollbild -->
  <div class="modal" id="expand" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="expand-title">
      <div class="modal-head">
        <span class="card-label" id="expand-title"></span>
        <button class="card-btn" data-close aria-label="Schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body md" id="expand-body"></div>
    </div>
  </div>

  <!-- Vorschau für HTML-Code -->
  <!-- Webseiten-Vorschau (Bottom-Sheet) -->
  <div class="psheet" id="preview" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="psheet-panel" role="dialog" aria-modal="true" aria-label="Webseite">
      <div class="sheet-grip" data-close aria-hidden="true"></div>
      <div class="ptools">
        <div class="pseg" role="tablist" aria-label="Ansicht">
          <button type="button" role="tab" data-ptab="view" aria-label="Vorschau" title="Vorschau">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button type="button" role="tab" data-ptab="code" aria-label="Code" title="Code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
          </button>
        </div>
        <div class="paddr">
          <button type="button" id="preview-reload" aria-label="Neu laden" title="Neu laden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <span>/</span>
        </div>
        <button type="button" class="pbtn" id="preview-download" aria-label="Herunterladen" title="Als HTML-Datei herunterladen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        </button>
        <button type="button" class="pbtn ghost" data-close aria-label="Schließen" title="Schließen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="pbody">
        <iframe id="preview-frame" title="Vorschau der Webseite" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
        <div class="pbuild" id="preview-build">
          <span class="bricks live"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <b id="preview-build-title">Baut …</b>
          <small id="preview-build-text">Die Vorschau erscheint, sobald die Webseite fertig ist.</small>
        </div>
        <div class="pcode" id="preview-code">
          <div class="pfile"><span>index.html</span></div>
          <pre><code></code></pre>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
